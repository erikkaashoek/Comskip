    - name: Configure, Build, and Install argtable2-13 for Cygwin
      if: ${{ env.compilerClass == 'Cygwin' }}
      env:
        # Cygwin OS variables
        SHELLOPTS: igncr
        CHERE_INVOKING: 1
        # Mingw OS variable
        msystem: ${{ env.compilerEnv }}
        MSYS2_LOCATION: ${{ steps.mingw_install.outputs.msys2-location }}
      run: |
        echo "BEGIN Configure, Build, and Install argtable2-13 for Cygwin"
        set -x -v -e
        # because I set CHERE_INVOKING to be 1
        export PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        echo "uname -a"
        uname -a

        # Argtable is an ANSI C command line parser.
        # https://argtable.sourceforge.io/
        #
        # Dockerfile in
        #   wget http://prdownloads.sourceforge.net/argtable/argtable2-13.tar.gz
        #   tar xzf argtable2-13.tar.gz
        #   cd argtable2-13/ && ./configure && make && make install
        #
        # https://cgit.git.savannah.gnu.org/cgit/config.git/
        # https://www.gnu.org/software/gettext/manual/html_node/config_002eguess.html
        # https://github.com/jemalloc/jemalloc/issues/2814
        # https://man7.org/linux/man-pages/man1/curl.1.html
        tar xzf argtable2-13.tar.gz
        pushd argtable2-13
          echo "New current directory: $(pwd)"
          # replace the old files
          # curl --verbose -L -O https://git.savannah.gnu.org/cgit/config.git/plain/config.guess
          rm config.guess
          cp ../config.guess .
          echo "Age of the file config.guess"
          ls -alrt config.guess
          # curl --verbose -L -O https://git.savannah.gnu.org/cgit/config.git/plain/config.sub
          rm config.sub
          cp ../config.sub .
          echo "Age of the file config.sub"
          ls -alrt config.sub
          ./config.guess --version
          ./config.sub   --version
          set +x +v +e
          #
          # SEEN AUG 20 2026
          # From gcc 13 to gcc 14, how have implicit function declaration handline changed ?
          # ...
          # Gemini AI answer ...
          # In GCC 14, implicit function declarations are treated as a hard compile-time error
          # (-Werror=implicit-function-declaration) instead of just generating a warning as they did
          # in GCC 13 and prior versions.
          #
          #   arg_int.c:89:8: warning: implicit declaration of function 'toupper' [-Wimplicit-function-declaration]
          #   arg_int.c:89:8: note: include '<ctype.h>' or provide a declaration of 'toupper
          #
          # Calling a function without a prior prototype or definition is no longer permitted by default.
          #
          # 13.4.0-1  x86_64  ...  2025-07-23 05:27
          # 14.4.0-1  x86_64  ...  2026-07-01 18:52
          # https://www.Cygwin.com/packages/summary/mingw64-i686-gcc-core.html
          #
          # solution 1 - patch (BETTER)
          # https://github.com/msys2/MINGW-packages/blob/master/mingw-w64-argtable/001-missing-ctype.patch
          # Add missing ctype.h and enable aarch64 builds
          # https://github.com/msys2/MINGW-packages/commit/8d64ae169b4d04b551022916c3dafbc54da8a2ee
          #
          # solution 2 (TEMPORARY)
          #
          # What C flag is used to turn
          # back the behavior "error: implicit declaration of function"
          # back to "warning: implicit declaration of function" ?
          #
          # Gemini AI answer ...
          # -Wno-error=implicit-function-declaration
          #
          # Therefore, now do ...
          # from
          # ./configure
          # to
          # CFLAGS="-Wno-error=implicit-function-declaration" ./configure
          #
          CFLAGS="-Wno-error=implicit-function-declaration" ./configure
          set -x -v -e
          # argtable2-13/INSTALL file of instructions
          make
          make install
          popd # from argtable2-13
        echo "New current directory: $(pwd)"
        echo "END   Configure, Build, and Install argtable2-13 for Cygwin"


